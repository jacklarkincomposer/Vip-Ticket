<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#080706">
  <title>Event Ticket</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    /* ── TOKENS ─────────────────────────────── */
    :root {
      --gold:        #c9a227;
      --gold-mid:    rgba(201,162,39,0.25);
      --gold-faint:  rgba(201,162,39,0.08);
      --bg:          #080706;
      --card:        #111009;
      --text:        #f0ece4;
      --muted:       #7a7368;
      --green:       #22c55e;
      --green-dim:   rgba(34,197,94,0.12);
      --r:           20px;
      --r-sm:        8px;
      --sans:        'Space Grotesk', sans-serif;
      --mono:        'Space Mono', monospace;
      --ease:        cubic-bezier(0.16,1,0.3,1);
    }

    /* ── BASE ───────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; text-size-adjust: none; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── VIEW SYSTEM ────────────────────────── */
    .view { display: none; width: 100%; padding: 28px 16px; min-height: 100dvh; align-items: center; justify-content: center; flex-direction: column; }
    .view.active { display: flex; }

    /* ════════════════════════════════════════
       TICKET VIEW
    ════════════════════════════════════════ */
    .ticket-wrap { width: 100%; max-width: 370px; display: flex; flex-direction: column; align-items: center; gap: 18px; }

    .ticket {
      width: 100%;
      background: var(--card);
      border-radius: var(--r);
      overflow: hidden;
      position: relative;
      box-shadow:
        0 0 0 1px var(--gold-mid),
        0 28px 72px rgba(0,0,0,0.75),
        0 0 120px rgba(201,162,39,0.03);
    }

    /* ambient top glow */
    .ticket-glow {
      position: absolute;
      top: -50px; right: -50px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(201,162,39,0.09), transparent 65%);
      border-radius: 50%;
      pointer-events: none;
    }

    /* ── Header ─ */
    .t-header { padding: 26px 26px 20px; }

    .t-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--gold-faint);
      border: 1px solid var(--gold-mid);
      color: var(--gold);
      font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 100px; margin-bottom: 16px;
    }

    .t-name { font-size: 27px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 4px; }
    .t-sub  { font-size: 13px; color: var(--muted); }

    /* ── Detail grid ─ */
    .t-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      padding: 18px 26px;
      border-top:    1px dashed var(--gold-mid);
      border-bottom: 1px dashed var(--gold-mid);
    }
    .t-lbl { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 3px; }
    .t-val { font-size: 13px; font-weight: 500; line-height: 1.35; }
    .t-val.mono { font-family: var(--mono); font-size: 12px; }

    /* ── Holder ─ */
    .t-holder { padding: 16px 26px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .t-holder-name { font-size: 19px; font-weight: 700; }
    .t-type-pill {
      background: var(--gold); color: #000;
      font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 5px 10px; border-radius: var(--r-sm); white-space: nowrap; flex-shrink: 0;
    }

    /* ── Perforation ─ */
    .perf { border: none; border-top: 1.5px dashed var(--gold-mid); margin: 0; }

    /* ── Stub ─ */
    .t-stub { padding: 18px 26px 22px; display: flex; align-items: center; gap: 16px; }

    .qr-box {
      width: 86px; height: 86px; flex-shrink: 0;
      background: #fff; border-radius: var(--r-sm);
      padding: 5px; overflow: hidden;
    }
    .qr-box canvas { width: 100% !important; height: 100% !important; display: block; }

    .stub-text {}
    .stub-lbl  { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
    .stub-num  { font-family: var(--mono); font-size: 11px; color: var(--gold); margin-bottom: 8px; letter-spacing: 0.04em; }
    .stub-admit { font-size: 17px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .stub-admit em { color: var(--gold); font-style: normal; }

    /* ── Preview button ─ */
    .preview-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--muted);
      font-family: var(--sans);
      font-size: 12px;
      padding: 10px 22px;
      border-radius: 100px;
      cursor: pointer;
      transition: border-color 180ms var(--ease), color 180ms var(--ease);
    }
    .preview-btn:hover { border-color: rgba(255,255,255,0.3); color: var(--text); }
    .preview-btn:active { transform: scale(0.97); }

    /* ════════════════════════════════════════
       ACCEPTED VIEW
    ════════════════════════════════════════ */
    #accepted-view {
      background:
        radial-gradient(ellipse 90% 55% at 50% 25%, rgba(34,197,94,0.08) 0%, transparent 70%),
        var(--bg);
    }

    .acc-card { text-align: center; padding: 48px 32px; max-width: 340px; width: 100%; }

    /* SVG checkmark */
    .check-wrap { width: 96px; height: 96px; margin: 0 auto 28px; position: relative; }

    .check-pulse {
      position: absolute; inset: -14px;
      border-radius: 50%;
      border: 2px solid rgba(34,197,94,0.18);
      animation: pulse 2.2s ease-in-out 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: 0.7; }
      50%       { transform: scale(1.1); opacity: 0.2; }
    }

    .check-svg { width: 96px; height: 96px; overflow: visible; display: block; }

    .c-bg    { fill: rgba(34,197,94,0.1); }
    .c-ring  {
      fill: none; stroke: var(--green); stroke-width: 2.5; stroke-linecap: round;
      stroke-dasharray: 276; stroke-dashoffset: 276;
      transform-origin: 48px 48px; transform: rotate(-90deg);
      animation: draw-ring 0.65s var(--ease) 0.3s forwards;
    }
    .c-tick  {
      fill: none; stroke: var(--green); stroke-width: 3.5;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 54; stroke-dashoffset: 54;
      animation: draw-tick 0.4s var(--ease) 0.95s forwards;
    }
    @keyframes draw-ring { to { stroke-dashoffset: 0; } }
    @keyframes draw-tick { to { stroke-dashoffset: 0; } }

    /* Text stagger */
    .a0 { opacity:0; transform:translateY(10px); animation: rise 0.5s var(--ease) 1.1s  forwards; }
    .a1 { opacity:0; transform:translateY(10px); animation: rise 0.5s var(--ease) 1.25s forwards; }
    .a2 { opacity:0;                             animation: rise 0.5s var(--ease) 1.4s  forwards; }
    .a3 { opacity:0; transform:translateY(10px); animation: rise 0.5s var(--ease) 1.55s forwards; }
    .a4 { opacity:0;                             animation: rise 0.5s var(--ease) 1.7s  forwards; }
    .a5 { opacity:0; transform:translateY(10px); animation: rise 0.5s var(--ease) 1.85s forwards; }
    @keyframes rise { to { opacity:1; transform:translateY(0); } }

    .acc-title  { font-size: 30px; font-weight: 800; color: var(--green); letter-spacing: 0.06em; text-transform: uppercase; }
    .acc-event  { font-size: 14px; color: var(--muted); margin-top: 6px; }
    .acc-sep    { width: 32px; height: 2px; background: var(--green); opacity: 0.35; border-radius: 100px; margin: 20px auto; }
    .acc-holder { font-size: 22px; font-weight: 700; }
    .acc-time   { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 12px; }
    .acc-chip   {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--green-dim);
      border: 1px solid rgba(34,197,94,0.3);
      color: var(--green);
      font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
      padding: 6px 14px; border-radius: 100px; margin-top: 20px;
    }
  </style>
</head>
<body>

<!-- ══════════════ TICKET VIEW ══════════════ -->
<div id="ticket-view" class="view">
  <div class="ticket-wrap">
    <div class="ticket" role="region" aria-label="Event ticket">
      <div class="ticket-glow" aria-hidden="true"></div>

      <div class="t-header">
        <div class="t-badge">✦ Official Ticket</div>
        <div class="t-name" id="ev-name"></div>
        <div class="t-sub"  id="ev-sub"></div>
      </div>

      <div class="t-grid">
        <div><div class="t-lbl">Date</div><div class="t-val" id="ev-date"></div></div>
        <div><div class="t-lbl">Time</div><div class="t-val" id="ev-time"></div></div>
        <div><div class="t-lbl">Venue</div><div class="t-val" id="ev-venue"></div></div>
        <div><div class="t-lbl">Seat</div><div class="t-val mono" id="ev-seat"></div></div>
      </div>

      <div class="t-holder">
        <div>
          <div class="t-lbl">Ticket Holder</div>
          <div class="t-holder-name" id="ev-holder"></div>
        </div>
        <div class="t-type-pill" id="ev-type"></div>
      </div>

      <hr class="perf" aria-hidden="true">

      <div class="t-stub">
        <div class="qr-box" aria-label="QR code — scan to verify">
          <canvas id="qr-canvas"></canvas>
        </div>
        <div class="stub-text">
          <div class="stub-lbl">Scan to Verify</div>
          <div class="stub-num" id="ev-num"></div>
          <div class="stub-admit">ADMIT <em>ONE</em></div>
        </div>
      </div>
    </div>

    <button class="preview-btn" id="preview-btn" aria-label="Preview the scan result">
      Preview scan result →
    </button>
  </div>
</div>

<!-- ══════════════ ACCEPTED VIEW ══════════════ -->
<div id="accepted-view" class="view" role="main" aria-live="polite">
  <div class="acc-card">

    <div class="check-wrap" aria-hidden="true">
      <div class="check-pulse"></div>
      <svg class="check-svg" viewBox="0 0 96 96" aria-hidden="true">
        <circle class="c-bg"   cx="48" cy="48" r="46"/>
        <circle class="c-ring" cx="48" cy="48" r="44"/>
        <path   class="c-tick" d="M27 48 L41 62 L69 34"/>
      </svg>
    </div>

    <div class="acc-title  a0">Ticket Accepted</div>
    <div class="acc-event  a1" id="acc-event"></div>
    <div class="acc-sep    a2" aria-hidden="true"></div>
    <div class="acc-holder a3" id="acc-holder"></div>
    <div class="acc-time   a4" id="acc-time"></div>
    <div class="acc-chip   a5">✓ Valid Entry — Enjoy the show!</div>

  </div>
</div>

<script>
  // ═══════════════════════════════════════════════
  // ✏️  EDIT YOUR TICKET DETAILS BELOW
  // ═══════════════════════════════════════════════
  const EVENT = {
    name:       "A Special Evening",
    subtitle:   "An Unforgettable Night",
    date:       "Monday, 30th March 2026",
    time:       "7:30 PM",
    venue:      "The Grand Theatre",
    seat:       "ROW A · SEAT 1",
    holder:     "Lily Lawson",  // ← Change this!
    type:       "VIP PASS",
    ticketRef:  "TKT-X7K2M9QP",           // ← Can change this too
  };
  // ═══════════════════════════════════════════════

  function acceptedUrl() {
    return window.location.href.split('?')[0] + '?scan=1';
  }

  const isAccepted = new URLSearchParams(window.location.search).get('scan') === '1';

  if (isAccepted) {
    initAccepted();
  } else {
    initTicket();
  }

  // ── Ticket ────────────────────────────────────
  function initTicket() {
    document.getElementById('ticket-view').classList.add('active');
    document.getElementById('ev-name').textContent   = EVENT.name;
    document.getElementById('ev-sub').textContent    = EVENT.subtitle;
    document.getElementById('ev-date').textContent   = EVENT.date;
    document.getElementById('ev-time').textContent   = EVENT.time;
    document.getElementById('ev-venue').textContent  = EVENT.venue;
    document.getElementById('ev-seat').textContent   = EVENT.seat;
    document.getElementById('ev-holder').textContent = EVENT.holder;
    document.getElementById('ev-type').textContent   = EVENT.type;
    document.getElementById('ev-num').textContent    = EVENT.ticketRef;

    QRCode.toCanvas(
      document.getElementById('qr-canvas'),
      acceptedUrl(),
      { width: 200, margin: 0, color: { dark: '#000000', light: '#ffffff' } },
      err => { if (err) console.error('QR error:', err); }
    );

    document.getElementById('preview-btn').addEventListener('click', () => {
      window.location.href = acceptedUrl();
    });
  }

  // ── Accepted ──────────────────────────────────
  function initAccepted() {
    document.getElementById('accepted-view').classList.add('active');
    document.getElementById('acc-event').textContent  = EVENT.name;
    document.getElementById('acc-holder').textContent = EVENT.holder;

    const now = new Date();
    const t   = now.toLocaleTimeString('en-GB',  { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    const d   = now.toLocaleDateString('en-GB',  { day:'numeric', month:'long', year:'numeric' });
    document.getElementById('acc-time').textContent = `Scanned ${t} · ${d}`;

    // Confetti bursts timed with animations
    setTimeout(() => confetti({
      particleCount: 120, spread: 70, origin: { y: 0.45 },
      colors: ['#22c55e','#86efac','#ffffff','#4ade80','#bbf7d0']
    }), 1100);

    setTimeout(() => {
      confetti({ particleCount: 55, angle:  60, spread: 50, origin: { x: 0,   y: 0.55 }, colors: ['#22c55e','#86efac','#ffffff'] });
      confetti({ particleCount: 55, angle: 120, spread: 50, origin: { x: 1,   y: 0.55 }, colors: ['#22c55e','#86efac','#ffffff'] });
    }, 1600);
  }
</script>
</body>
</html>
